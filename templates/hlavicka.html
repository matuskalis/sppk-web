<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hlavička a menu — SPPK</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html { font-family: 'Inter', system-ui, sans-serif; scroll-behavior: smooth; }

    body { background:#fff; color:#000; font-weight:500; line-height:20px; -webkit-font-smoothing:antialiased; }

    /* Scrollbar */
    ::-webkit-scrollbar { width:8px; }

    ::-webkit-scrollbar-track { background:#f0f0f0; }

    ::-webkit-scrollbar-thumb { background:#009a44; border-radius:4px; border:2px solid #f0f0f0; }

    ::-webkit-scrollbar-thumb:hover { background:#007a35; }

    * { scrollbar-width:thin; scrollbar-color:#009a44 #f0f0f0; }

    /* Nav link */
    .nav-link { position:relative; transition:color 0.2s ease; }

    .nav-link::after { content:''; position:absolute; bottom:0; left:18px; right:18px; height:2px; background:#009a44; border-radius:1px 1px 0 0; transform:scaleX(0); transition:transform 0.25s ease; }

    .nav-link.active::after, .nav-link:hover::after { transform:scaleX(1); }

    .nav-link.active { color:#009a44 !important; font-weight:600 !important; }

    .nav-link:hover { color:#009a44 !important; }

    /* Hamburger — desktop hidden */
    .hamburger-btn { display:none !important; }

    .mobile-active-label { display:none !important; }

    .mobile-drawer { display:none; }

    /* ── Mobile ─────────────────────────────────────────── */
    @media (max-width:768px) {
      .upper-header-inner { flex-direction:column !important; align-items:center !important; padding:14px 16px !important; gap:12px !important; min-height:unset !important; }

    .hamburger-btn { display:flex !important; }

    .mobile-active-label { display:block !important; }
  </style>
</head>
<body>

<!-- ════════════════════════════════════════════ UPPER HEADER -->
<header style="background:#009a44;width:100%;">
  <div class="upper-header-inner" style="max-width:1200px;margin:0 auto;padding:0 24px;display:flex;align-items:stretch;justify-content:space-between;min-height:80px;">

    <!-- Logo + Name -->
    <div class="upper-header-logo" style="display:flex;align-items:center;gap:16px;padding:14px 0;">
      <div style="width:52px;height:52px;border-radius:6px;background:rgba(255,255,255,0.18);border:1.5px solid rgba(255,255,255,0.35);display:flex;align-items:center;justify-content:center;flex-shrink:0;overflow:hidden;">
        <img src="images/sppk-logo.png" alt="SPPK" style="width:100%;height:100%;object-fit:contain;"
          onerror="this.style.display='none';this.parentElement.innerHTML='<span style=\'color:#fff;font-size:11px;font-weight:700;text-align:center;line-height:1.2;padding:4px\'>SPPK</span>';" />
      </div>
      <div>
        <div class="corp-name" style="color:#fff;font-family:'DM Serif Display',serif;font-size:clamp(15px,2.5vw,24px);font-weight:400;letter-spacing:0.01em;line-height:1.25;">Slovenská poľnohospodárska</div>
        <div class="corp-name" style="color:#fff;font-family:'DM Serif Display',serif;font-size:clamp(15px,2.5vw,24px);font-weight:400;letter-spacing:0.01em;line-height:1.25;">a potravinárska komora</div>
      </div>
    </div>

    <!-- Right utilities -->
    <div class="upper-header-right" style="display:flex;flex-direction:column;justify-content:center;align-items:flex-end;gap:10px;padding:12px 0;">

      <!-- Search + languages -->
      <div class="upper-search-row" style="display:flex;align-items:center;gap:20px;">
        <div style="display:flex;align-items:center;gap:8px;background:rgba(255,255,255,0.15);border:1px solid rgba(255,255,255,0.25);border-radius:4px;padding:6px 12px;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input type="text" placeholder="Hľadať na sppk.sk..." class="upper-search-input" style="background:none;border:none;outline:none;color:#fff;font-size:13px;font-family:'Inter',sans-serif;width:180px;letter-spacing:0.02em;" />
        </div>
        <div style="display:flex;gap:4px;align-items:center;color:#fff;font-size:11.5px;font-weight:500;letter-spacing:0.08em;">
          <button style="background:none;border:none;color:#fff;font-size:11.5px;font-weight:500;letter-spacing:0.08em;cursor:pointer;font-family:'Inter',sans-serif;" onmouseenter="this.style.opacity='.7'" onmouseleave="this.style.opacity='1'">EN</button>
          <span style="opacity:.4;">|</span>
          <button style="background:none;border:none;color:#fff;font-size:11.5px;font-weight:500;letter-spacing:0.08em;cursor:pointer;font-family:'Inter',sans-serif;" onmouseenter="this.style.opacity='.7'" onmouseleave="this.style.opacity='1'">DE</button>
          <span style="opacity:.4;">|</span>
          <button style="background:none;border:none;color:#fff;font-size:11.5px;font-weight:500;letter-spacing:0.08em;cursor:pointer;font-family:'Inter',sans-serif;" onmouseenter="this.style.opacity='.7'" onmouseleave="this.style.opacity='1'">FR</button>
        </div>
      </div>

      <!-- Prihlásenie + social -->
      <div class="upper-social-row" style="display:flex;align-items:center;justify-content:flex-end;">
        <div style="position:relative;margin-right:12px;">
          <button id="login-btn" onclick="toggleLogin()" style="background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.35);border-radius:4px;color:#fff;cursor:pointer;height:32px;padding:0 12px;display:flex;align-items:center;font-size:12px;font-weight:600;letter-spacing:0.05em;font-family:'Inter',sans-serif;white-space:nowrap;transition:background 0.2s ease;"
            onmouseenter="this.style.background='rgba(255,255,255,0.25)'" onmouseleave="if(!loginOpen)this.style.background='rgba(255,255,255,0.1)'">
            Prihlásenie
          </button>
        </div>
        <div style="display:flex;align-items:center;gap:8px;">
          <button aria-label="Facebook" style="background:rgba(255,255,255,0.15);border:1px solid rgba(255,255,255,0.2);border-radius:4px;color:#fff;cursor:pointer;width:32px;height:32px;display:flex;align-items:center;justify-content:center;transition:background 0.2s ease;" onmouseenter="this.style.background='rgba(255,255,255,0.28)'" onmouseleave="this.style.background='rgba(255,255,255,0.15)'">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3z"/></svg>
          </button>
          <button aria-label="LinkedIn" style="background:rgba(255,255,255,0.15);border:1px solid rgba(255,255,255,0.2);border-radius:4px;color:#fff;cursor:pointer;width:32px;height:32px;display:flex;align-items:center;justify-content:center;transition:background 0.2s ease;" onmouseenter="this.style.background='rgba(255,255,255,0.28)'" onmouseleave="this.style.background='rgba(255,255,255,0.15)'">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6z"/><rect x="2" y="9" width="4" height="12"/><circle cx="4" cy="4" r="2"/></svg>
          </button>
          <button aria-label="YouTube" style="background:rgba(255,255,255,0.15);border:1px solid rgba(255,255,255,0.2);border-radius:4px;color:#fff;cursor:pointer;width:32px;height:32px;display:flex;align-items:center;justify-content:center;transition:background 0.2s ease;" onmouseenter="this.style.background='rgba(255,255,255,0.28)'" onmouseleave="this.style.background='rgba(255,255,255,0.15)'">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M22.54 6.42a2.78 2.78 0 0 0-1.95-1.96C18.88 4 12 4 12 4s-6.88 0-8.59.46a2.78 2.78 0 0 0-1.95 1.96A29 29 0 0 0 1 12a29 29 0 0 0 .46 5.58 2.78 2.78 0 0 0 1.95 1.95C5.12 20 12 20 12 20s6.88 0 8.59-.47a2.78 2.78 0 0 0 1.95-1.95A29 29 0 0 0 23 12a29 29 0 0 0-.46-5.58z"/><polygon points="9.75 15.02 15.5 12 9.75 8.98 9.75 15.02" fill="white"/></svg>
          </button>
          <button aria-label="Instagram" style="background:rgba(255,255,255,0.15);border:1px solid rgba(255,255,255,0.2);border-radius:4px;color:#fff;cursor:pointer;width:32px;height:32px;display:flex;align-items:center;justify-content:center;transition:background 0.2s ease;" onmouseenter="this.style.background='rgba(255,255,255,0.28)'" onmouseleave="this.style.background='rgba(255,255,255,0.15)'">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="5" ry="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="0.5" fill="currentColor"/></svg>
          </button>
        </div>
      </div>
    </div>
  </div>
</header>

<!-- Login backdrop -->
<div id="login-backdrop" onclick="closeLogin()" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.35);z-index:9998;"></div>
<!-- Login modal -->
<div id="login-modal" class="login-modal" style="display:none;position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:9999;width:320px;background:#fff;border-radius:12px;box-shadow:0 24px 64px rgba(0,0,0,0.22),0 4px 16px rgba(0,0,0,0.10);border:1px solid rgba(0,154,68,0.15);padding:24px 22px 20px;">
  <div style="margin-bottom:20px;">
    <div style="font-size:16px;font-weight:700;color:#000;margin-bottom:4px;">Prihlásenie</div>
    <div style="font-size:12px;color:#888;">Prihláste sa do svojho účtu SPPK</div>
  </div>
  <div style="margin-bottom:14px;">
    <label style="display:block;font-size:12px;font-weight:600;color:#000;margin-bottom:6px;letter-spacing:0.02em;">Prihlasovacie meno (E-mail):</label>
    <input type="email" placeholder="vas@email.sk" style="width:100%;height:40px;border:1px solid rgba(0,0,0,0.18);border-radius:8px;padding:0 12px;font-size:13.5px;color:#000;font-family:'Inter',sans-serif;outline:none;background:#fafafa;transition:border-color 0.2s ease;"
      onfocus="this.style.borderColor='#009a44'" onblur="this.style.borderColor='rgba(0,0,0,0.18)'" />
  </div>
  <div style="margin-bottom:14px;">
    <label style="display:block;font-size:12px;font-weight:600;color:#000;margin-bottom:6px;letter-spacing:0.02em;">Heslo:</label>
    <input type="password" placeholder="••••••••" style="width:100%;height:40px;border:1px solid rgba(0,0,0,0.18);border-radius:8px;padding:0 12px;font-size:13.5px;color:#000;font-family:'Inter',sans-serif;outline:none;background:#fafafa;transition:border-color 0.2s ease;"
      onfocus="this.style.borderColor='#009a44'" onblur="this.style.borderColor='rgba(0,0,0,0.18)'" />
  </div>
  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;">
    <label style="display:flex;align-items:center;gap:7px;cursor:pointer;">
      <input type="checkbox" style="width:14px;height:14px;accent-color:#009a44;cursor:pointer;" />
      <span style="font-size:12px;color:#444;">Zapamätať si</span>
    </label>
    <a href="#" style="font-size:12px;color:#777;text-decoration:none;" onmouseenter="this.style.color='#009a44'" onmouseleave="this.style.color='#777'">Zabudnuté heslo?</a>
  </div>
  <button onclick="closeLogin()" style="width:100%;height:42px;background:#009a44;border:none;border-radius:8px;color:#fff;font-size:14px;font-weight:700;letter-spacing:0.04em;cursor:pointer;font-family:'Inter',sans-serif;transition:background 0.2s ease;"
    onmouseenter="this.style.background='#007a35'" onmouseleave="this.style.background='#009a44'">Prihlásiť sa</button>
  <div style="margin-top:12px;text-align:center;">
    <button onclick="closeLogin()" style="background:none;border:none;font-size:11.5px;color:#aaa;cursor:pointer;font-family:'Inter',sans-serif;">Zavrieť ✕</button>
  </div>
</div>

<!-- ════════════════════════════════════════════════════ NAV BAR -->
<nav id="navbar" style="background:#fff;border-bottom:1px solid #009a44;position:sticky;top:0;z-index:200;box-shadow:0 2px 12px rgba(0,154,68,0.06);">
  <div style="max-width:1200px;margin:0 auto;padding:0 16px;display:flex;align-items:center;justify-content:space-between;">

    <!-- Desktop links -->
    <div class="desktop-nav-links" style="display:flex;align-items:center;gap:2px;">
      <button class="nav-link active" onclick="setNavActive(this)" style="background:none;border:none;color:#009a44;font-size:13.5px;font-weight:600;letter-spacing:0.03em;cursor:pointer;padding:16px 18px;font-family:'Inter',sans-serif;transition:color 0.2s ease;position:relative;">Úvod</button>
      <button class="nav-link" onclick="setNavActive(this)" style="background:none;border:none;color:#000;font-size:13.5px;font-weight:400;letter-spacing:0.03em;cursor:pointer;padding:16px 18px;font-family:'Inter',sans-serif;transition:color 0.2s ease;position:relative;">Tlačové správy</button>
      <button class="nav-link" onclick="setNavActive(this)" style="background:none;border:none;color:#000;font-size:13.5px;font-weight:400;letter-spacing:0.03em;cursor:pointer;padding:16px 18px;font-family:'Inter',sans-serif;transition:color 0.2s ease;position:relative;">Dokumenty</button>
      <button class="nav-link" onclick="setNavActive(this)" style="background:none;border:none;color:#000;font-size:13.5px;font-weight:400;letter-spacing:0.03em;cursor:pointer;padding:16px 18px;font-family:'Inter',sans-serif;transition:color 0.2s ease;position:relative;">Legislatíva</button>
      <button class="nav-link" onclick="setNavActive(this)" style="background:none;border:none;color:#000;font-size:13.5px;font-weight:400;letter-spacing:0.03em;cursor:pointer;padding:16px 18px;font-family:'Inter',sans-serif;transition:color 0.2s ease;position:relative;">O nás</button>
      <button class="nav-link" onclick="setNavActive(this)" style="background:none;border:none;color:#000;font-size:13.5px;font-weight:400;letter-spacing:0.03em;cursor:pointer;padding:16px 18px;font-family:'Inter',sans-serif;transition:color 0.2s ease;position:relative;">Kontakt</button>
    </div>

    <!-- Mobile: active label + hamburger -->
    <span class="mobile-active-label" id="mob-active-label" style="font-size:14px;font-weight:600;color:#009a44;padding:16px 0;">Úvod</span>
    <button class="hamburger-btn" id="hamburger" onclick="toggleMobileMenu()" aria-label="Menu" style="background:none;border:none;cursor:pointer;padding:14px 8px;display:flex;flex-direction:column;gap:5px;align-items:center;justify-content:center;">
      <span id="hb1" style="display:block;width:24px;height:2.5px;background:#000;border-radius:2px;transition:transform 0.25s ease,opacity 0.2s ease;"></span>
      <span id="hb2" style="display:block;width:24px;height:2.5px;background:#000;border-radius:2px;transition:opacity 0.2s ease;"></span>
      <span id="hb3" style="display:block;width:24px;height:2.5px;background:#000;border-radius:2px;transition:transform 0.25s ease;"></span>
    </button>
  </div>

  <!-- Mobile drawer -->
  <div id="mobile-drawer" class="mobile-drawer" style="display:none;flex-direction:column;border-top:1px solid rgba(0,154,68,0.15);background:#fff;padding:8px 0 12px;">
    <button onclick="mobileNavClick(this,'Úvod')" style="background:none;border:none;text-align:left;padding:13px 24px;font-size:15px;font-weight:700;color:#009a44;cursor:pointer;font-family:'Inter',sans-serif;border-left:3px solid #009a44;" onmouseenter="this.style.background='rgba(0,154,68,0.05)'" onmouseleave="this.style.background='none'">Úvod</button>
    <button onclick="mobileNavClick(this,'Tlačové správy')" style="background:none;border:none;text-align:left;padding:13px 24px;font-size:15px;font-weight:400;color:#000;cursor:pointer;font-family:'Inter',sans-serif;border-left:3px solid transparent;" onmouseenter="this.style.background='rgba(0,154,68,0.05)'" onmouseleave="this.style.background='none'">Tlačové správy</button>
    <button onclick="mobileNavClick(this,'Dokumenty')" style="background:none;border:none;text-align:left;padding:13px 24px;font-size:15px;font-weight:400;color:#000;cursor:pointer;font-family:'Inter',sans-serif;border-left:3px solid transparent;" onmouseenter="this.style.background='rgba(0,154,68,0.05)'" onmouseleave="this.style.background='none'">Dokumenty</button>
    <button onclick="mobileNavClick(this,'Legislatíva')" style="background:none;border:none;text-align:left;padding:13px 24px;font-size:15px;font-weight:400;color:#000;cursor:pointer;font-family:'Inter',sans-serif;border-left:3px solid transparent;" onmouseenter="this.style.background='rgba(0,154,68,0.05)'" onmouseleave="this.style.background='none'">Legislatíva</button>
    <button onclick="mobileNavClick(this,'O nás')" style="background:none;border:none;text-align:left;padding:13px 24px;font-size:15px;font-weight:400;color:#000;cursor:pointer;font-family:'Inter',sans-serif;border-left:3px solid transparent;" onmouseenter="this.style.background='rgba(0,154,68,0.05)'" onmouseleave="this.style.background='none'">O nás</button>
    <button onclick="mobileNavClick(this,'Kontakt')" style="background:none;border:none;text-align:left;padding:13px 24px;font-size:15px;font-weight:400;color:#000;cursor:pointer;font-family:'Inter',sans-serif;border-left:3px solid transparent;" onmouseenter="this.style.background='rgba(0,154,68,0.05)'" onmouseleave="this.style.background='none'">Kontakt</button>
  </div>
</nav>

<script>let loginOpen = false;
let mobileOpen = false;

function toggleLogin() {
    loginOpen = !loginOpen;
    document.getElementById('login-modal').style.display = loginOpen ? 'block' : 'none';
    document.getElementById('login-backdrop').style.display = loginOpen ? 'block' : 'none';
    document.getElementById('login-btn').style.background = loginOpen ? 'rgba(255,255,255,0.25)' : 'rgba(255,255,255,0.1)';
  }

function closeLogin() {
    loginOpen = false;
    document.getElementById('login-modal').style.display = 'none';
    document.getElementById('login-backdrop').style.display = 'none';
    document.getElementById('login-btn').style.background = 'rgba(255,255,255,0.1)';
  }

function setNavActive(el) {
    document.querySelectorAll('.nav-link').forEach(b => {
      b.classList.remove('active');
      b.style.color = '#000';
      b.style.fontWeight = '400';
    });
    el.classList.add('active');
    el.style.color = '#009a44';
    el.style.fontWeight = '600';
  }

function toggleMobileMenu() {
    menuOpen = !menuOpen;
    const drawer = document.getElementById('mobile-drawer');
    drawer.style.display = menuOpen ? 'flex' : 'none';
    const hb1 = document.getElementById('hb1');
    const hb2 = document.getElementById('hb2');
    const hb3 = document.getElementById('hb3');
    hb1.style.transform = menuOpen ? 'translateY(7.5px) rotate(45deg)' : 'none';
    hb2.style.opacity = menuOpen ? '0' : '1';
    hb3.style.transform = menuOpen ? 'translateY(-7.5px) rotate(-45deg)' : 'none';
  }

function mobileNavClick(el, label) {
    document.querySelectorAll('#mobile-drawer button').forEach(b => {
      b.style.color = '#000';
      b.style.fontWeight = '400';
      b.style.borderLeft = '3px solid transparent';
    });
    el.style.color = '#009a44';
    el.style.fontWeight = '700';
    el.style.borderLeft = '3px solid #009a44';
    document.getElementById('mob-active-label').textContent = label;
    toggleMobileMenu();
  }</script>
</body>
</html>
