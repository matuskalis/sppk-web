    .card {

    .contact-value {

      color: #009a44;

    }

    .portrait {
      border-radius: 12px;
      background: linear-gradient(145deg, #e8f5ee, #c8e8d4);
      border: 1px solid rgba(0,154,68,0.18);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;

    .portrait img {

    .portrait-initials {

    .section-heading h2 {

      color: #000000;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .rule {
      flex: 1 1 0;
      min-width: 0;
      height: 1px;
      background: linear-gradient(to right, rgba(0,154,68,0.4), transparent);
    }

    .duty-divider {
      border-top: 1px solid rgba(0,154,68,0.15);
      padding-top: 18px;
      margin-top: 20px;

    .duty-heading {

    .duty-list {

      flex-direction: column;

    .duty-list li { display: flex; gap: 8px; align-items: baseline; }

    .duty-dash { color: #009a44; font-size: 15px; font-weight: 700; line-height: 1.6; flex-shrink: 0; }

    .duty-text { font-size: 15px; color: #333333; line-height: 1.6; }

    .section-heading h2 { font-size: 17px; }

    /* Mobile card padding */
    .card { padding: 22px 18px; margin-bottom: 12px; }

    .card:last-child { margin-bottom: 0; }

    /* Portrait cards: portrait centred on top, text below */
    .card-portrait {

      align-items: center;
      gap: 20px;
    }

    .portrait.size-portrait {
      width: 150px;
      height: 150px;
    }

    .portrait-initials { font-size: 48px; }

    .card-body { width: 100%; }

    .section-heading h2 { font-size: 22px; }

    .card { padding: 28px 32px; margin-bottom: 14px; }

    /* Portrait cards: portrait left, text right */
      .card-portrait {
        flex-direction: row;
        align-items: flex-start;
        gap: 28px;
      }

    .portrait.size-portrait {
        width: 110px;
        height: 110px;
      }

    .portrait-initials { font-size: 36px; }

    .card-body { flex: 1; min-width: 0; }

    .contact-page .section { margin-bottom: 52px; }
    .contact-page .section-heading h2 { font-size: 22px; }
    .contact-page .card { padding: 28px 32px; margin-bottom: 14px; }
    .contact-page .card-portrait { display:flex; flex-direction:row; align-items:flex-start; gap:28px; }
    .contact-page .portrait.size-portrait { width:110px; height:110px; }
    .contact-page .card-body { flex:1; min-width:0; }
    @media (max-width: 767px) {

      .contact-page .portrait.size-portrait { width:150px; height:150px; }
      /* The delivered design keeps contact rows on one line; long addresses
         overflow a 390px screen, so they wrap here. */
      .contact-page .contact-row { white-space:normal; flex-wrap:wrap; }
      /* Department names are longer than a phone screen; the design pins them to
         one line, which pushes the page sideways. */
      .contact-page .section-heading { flex-wrap:wrap; }
      .contact-page .section-heading h2 { white-space:normal; font-size:18px; }
      .contact-page .contact-email { overflow-wrap:anywhere; }
      .contact-page .card { padding:22px 18px; }

    /* ── Označenie členského obsahu ──────────────────────── */
    .members-tag {
      display:inline-block; margin-left:8px; padding:2px 8px; border-radius:20px;
      background:rgba(0,154,68,0.10); color:#009a44; font-size:10.5px; font-weight:700;
      letter-spacing:0.06em; text-transform:uppercase; vertical-align:middle;
    }
    .members-note {
      margin:0 0 32px; padding:14px 18px; border-left:4px solid #009a44;
      background:#f4faf6; border-radius:0 8px 8px 0; font-size:13.5px; color:#33604a;
      line-height:1.6;
    }

    /* ── Detail príspevku ────────────────────────────────── */
    .doc-title {
      margin:0 0 20px; font-family:'DM Serif Display',serif; font-weight:400; color:#000;
      font-size:clamp(30px,3.8vw,42px); line-height:1.15; letter-spacing:-0.01em;
    }
    .doc-meta { margin:0 0 52px; font-size:14px; font-weight:500; color:#4a4a4a;
      line-height:1.7; letter-spacing:0.01em; }
    .doc-meta-item { display:inline-block; }
    .doc-meta-sep { color:#009a44; margin:0 10px; font-weight:700; }

    .doc-body h2, .doc-body h3, .doc-body h4, .doc-body h5, .doc-body h6 {
      margin:0 0 24px; font-family:'Inter',sans-serif; font-size:22px; font-weight:700;
      color:#009a44; line-height:1.25; letter-spacing:-0.015em;
    }
    .doc-body p {
      margin:0 0 36px; font-size:16px; font-weight:400; color:#000; line-height:1.85;
      letter-spacing:0.004em; text-align:justify; overflow-wrap:anywhere;
    }
    .doc-body ul, .doc-body ol { margin:0 0 36px; padding-left:24px; font-size:16px;
      line-height:1.85; letter-spacing:0.004em; }
    .doc-body ul { list-style:none; padding-left:22px; }
    .doc-body li { margin-bottom:10px; }
    .doc-body ul > li { position:relative; }
    .doc-body ul > li::before {
      content:''; position:absolute; left:-18px; top:0.7em; width:7px; height:7px;
      border-radius:50%; background:#009a44;
    }
    .doc-body a { color:#009a44; text-decoration:underline; text-underline-offset:3px;
      overflow-wrap:anywhere; }
    .doc-body a.external::after { content:' ↗'; font-size:0.85em; text-decoration:none;
      display:inline-block; }
    .doc-body strong { font-weight:600; }
    .doc-body table { border-collapse:collapse; width:100%; font-size:15px; line-height:1.6;
      margin:0 0 36px; display:block; overflow-x:auto; }
    .doc-body th, .doc-body td { padding:10px 14px; border:1px solid #e6e6e6;
      text-align:left; vertical-align:top; }
    .doc-body th { background:#e6f5ed; font-weight:600; }

    /* Obrázky sú samostatné bloky, text okolo nich neobteká. */
    .doc-figure { float:none; clear:both; display:block; margin:0 auto 36px; width:100%;
      text-align:center; }
    .doc-figure img { float:none; display:block; width:auto; max-width:100%; height:auto;
      margin:0 auto; border-radius:12px; }
    .doc-figure iframe, .doc-figure video, .doc-figure embed, .doc-figure object {
      float:none; display:block; width:100%; max-width:100%; aspect-ratio:16/9; height:auto;
      border:0; border-radius:12px;
    }

    /* ── Výpis článkov ───────────────────────────────────── */
    .feed-card { display:flex; gap:28px; align-items:flex-start; padding-bottom:28px;
      margin-bottom:28px; border-bottom:1px solid rgba(0,0,0,0.07); }
    .feed-card:last-of-type { border-bottom:0; }
    .feed-text { flex:1; min-width:0; }
    .feed-date { font-size:12px; font-weight:600; color:#009a44; letter-spacing:0.02em;

    .feed-title { margin:0 0 10px; font-family:'DM Serif Display',serif; font-size:22px;

    .feed-title a { color:#000; text-decoration:none; transition:color 0.2s ease; }

    .feed-excerpt { margin:0 0 10px; font-size:14.5px; color:#555; line-height:1.7;

    .feed-author { font-size:12px; color:#999; font-style:italic; }

    .feed-thumb img { width:100%; height:100%; object-fit:cover; display:block;

    .feed-thumb:hover img { transform:scale(1.05); }

    .doc-intro { margin:0 0 52px; font-size:16px; font-weight:500; color:#000;

    .doc-para { margin:0 0 36px; font-size:16px; font-weight:400; color:#000;

    .doc-subheading { margin:0 0 24px; font-family:'Inter',sans-serif; font-size:22px;
      font-weight:700; color:#009a44; line-height:1.25; letter-spacing:-0.015em; }

    /* ── Videoarchív ─────────────────────────────────────── */
    .yt-card {
      max-width:640px; margin:0 auto; background:#fff; border-radius:14px;
      padding:32px 28px; text-align:center;
      box-shadow:0 4px 28px rgba(0,0,0,0.07), 0 1px 4px rgba(0,0,0,0.04);
    }
    .yt-mark {
      width:52px; height:52px; margin:0 auto 18px; border-radius:12px;
      background:#e02f2f; display:flex; align-items:center; justify-content:center;
    }
    .yt-label {
      margin:0 0 6px; font-size:11px; font-weight:700; letter-spacing:0.1em;
      color:#009a44; text-transform:uppercase;
    }
    .yt-text { margin:0 0 22px; font-size:14px; color:#555; line-height:1.6; }
    .yt-btn {
      display:inline-block; background:#009a44; color:#fff; text-decoration:none;
      font-size:13px; font-weight:600; letter-spacing:0.02em;
      padding:12px 26px; border-radius:999px;
      box-shadow:0 4px 14px rgba(0,154,68,0.35); transition:background 0.2s ease;
    }
    .yt-btn:hover { background:#007d36; }

    /* ── Zoznam albumov ──────────────────────────────────── */
    .album-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:24px; }
    .album-card { display:flex; flex-direction:column; gap:12px; text-decoration:none; }
    .album-cover { position:relative; aspect-ratio:4/3; border-radius:12px; overflow:hidden;
      background:#e6f5ed; }
    .album-cover img { width:100%; height:100%; object-fit:cover; display:block;
      transition:transform 0.4s cubic-bezier(0.4,0,0.2,1); }
    .album-card:hover .album-cover img { transform:scale(1.05); }
    .album-count { position:absolute; right:10px; bottom:10px; background:rgba(0,0,0,0.62);
      color:#fff; font-size:11px; font-weight:600; padding:4px 9px; border-radius:20px; }
    .album-title { font-size:14px; font-weight:600; color:#000; line-height:1.45;
      transition:color 0.2s ease; display:-webkit-box; -webkit-line-clamp:3;
      -webkit-box-orient:vertical; overflow:hidden; }
    .album-card:hover .album-title { color:#009a44; }

    /* ── Album fotografií ────────────────────────────────── */
    .photo-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:16px; }
    .photo { display:block; aspect-ratio:4/3; border-radius:12px; overflow:hidden;
      background:#e6f5ed; }
    .photo img { width:100%; height:100%; object-fit:cover; display:block;
      transition:transform 0.4s cubic-bezier(0.4,0,0.2,1); }
    .photo:hover img { transform:scale(1.05); }

    /* Secondary headings on article-template pages are the chamber green. */
    .section-heading-plain {
      margin:0 0 20px; font-family:'Inter',sans-serif; font-weight:700;
      font-size:22px; color:#009a44; line-height:1.25; letter-spacing:-0.015em;
    }

    /* ── Rozcestník sekcie ───────────────────────────────── */
    .section-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:16px; }
    .section-card {
      display:flex; align-items:center; min-height:76px; padding:18px 20px;
      border:1px solid rgba(0,0,0,0.10); border-left:3px solid #009a44; border-radius:12px;
      text-decoration:none; color:#000; font-size:14.5px; font-weight:600; line-height:1.45;
      transition:all 0.2s ease; background:#fff;
    }
    .section-card:hover { border-color:#009a44; color:#009a44;
      box-shadow:0 4px 20px rgba(0,154,68,0.10); }

    @media (max-width:1024px) {
      .photo-grid, .album-grid { grid-template-columns:repeat(3,1fr); }
      .section-grid { grid-template-columns:repeat(2,1fr); }
    }
    @media (max-width:768px) {
      .page-section { padding:28px 14px 56px; }
      .photo-grid, .album-grid { grid-template-columns:repeat(2,1fr); gap:10px; }
      .section-grid { grid-template-columns:1fr; }
      .feed-card { flex-direction:column-reverse; gap:14px; }
      .feed-thumb { width:100%; height:190px; }
    }

  </style>
