<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Stanovy SPPK — Slovenská poľnohospodárska a potravinárska komora</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; }

    html {
      font-family: 'Inter', system-ui, sans-serif;
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      background: #ffffff;
      color: #000000;
      -webkit-font-smoothing: antialiased;
    }

    .page-shell {
      min-height: 100vh;
      background-color: #ffffff;
    }

    .page-section {
      max-width: 1200px;
      margin: 0 auto;
      padding: 60px 24px 80px;
    }

    /* ── Article ── */
    article {
      font-family: 'Inter', sans-serif;
      background-color: #ffffff;
      width: 100%;
    }

    /* ── Main title ── */
    .doc-title {
      margin: 0 0 20px;
      font-family: 'DM Serif Display', serif;
      font-size: clamp(30px, 3.8vw, 42px);
      font-weight: 400;
      color: #000000;
      line-height: 1.15;
      letter-spacing: -0.01em;
    }

    /* ── Meta line: author • date • source ── */
    .doc-meta {
      margin: 0 0 52px;
      font-size: 14px;
      font-weight: 500;
      color: #4a4a4a;
      line-height: 1.7;
      letter-spacing: 0.01em;
    }

    .doc-meta-item {
      display: inline-block;
    }

    .doc-meta-sep {
      color: #009a44;
      margin: 0 10px;
      font-weight: 700;
    }

    /* ── Intro paragraph ── */
    .doc-intro {
      margin: 0 0 52px;
      font-size: 16px;
      font-weight: 500;
      color: #000000;
      line-height: 1.85;
      letter-spacing: 0.004em;
    }

    /* ── Section subheadings ── */
    .doc-subheading,
    .doc-body h2,
    .doc-body h3,
    .doc-body h4,
    .doc-body h5,
    .doc-body h6 {
      margin: 0 0 24px;
      font-family: 'Inter', sans-serif;
      font-size: 22px;
      font-weight: 700;
      color: #009a44;
      line-height: 1.25;
      letter-spacing: -0.015em;
    }

    .doc-body p {
      margin: 0 0 36px;
      font-size: 16px;
      font-weight: 400;
      color: #000000;
      line-height: 1.85;
      letter-spacing: 0.004em;
      text-align: justify;
      overflow-wrap: anywhere;
    }

    .doc-body p:last-child { margin-bottom: 0; }

    .doc-body ul,
    .doc-body ol {
      margin: 0 0 36px;
      padding-left: 24px;
      font-size: 16px;
      line-height: 1.85;
      letter-spacing: 0.004em;
    }

    .doc-body ul { list-style: none; padding-left: 22px; }

    .doc-body li { margin-bottom: 10px; }

    .doc-body ul > li {
      position: relative;
    }

    .doc-body ul > li::before {
      content: '';
      position: absolute;
      left: -18px;
      top: 0.7em;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #009a44;
    }

    .doc-body a {
      color: #009a44;
      text-decoration: underline;
      text-underline-offset: 3px;
      overflow-wrap: anywhere;
    }

    .doc-body a.external::after {
      content: ' ↗';
      font-size: 0.85em;
      text-decoration: none;
      display: inline-block;
    }

    /* ── Legacy CMS tables: scroll inside their own box, never the page ── */
    .doc-table {
      margin: 0 0 36px;
      overflow-x: auto;
    }

    .doc-table table {
      border-collapse: collapse;
      width: 100%;
      font-size: 15px;
      line-height: 1.6;
    }

    .doc-table th,
    .doc-table td {
      padding: 10px 14px;
      border: 1px solid #e6e6e6;
      text-align: left;
      vertical-align: top;
    }

    .doc-table th {
      background: #e6f5ed;
      font-weight: 600;
    }

    .doc-body strong { font-weight: 600; }

    /* ── Images: standalone blocks, text never wraps around them ── */
    .doc-figure {
      float: none;
      clear: both;
      display: block;
      margin: 0 auto 36px;
      width: 100%;
      text-align: center;
    }

    /* Rounded corners come from the delivered prispevky.html. width:auto departs
       from it on purpose: w-full there would blow a 75px logo up to 1152px. */
    .doc-figure img {
      float: none;
      display: block;
      width: auto;
      max-width: 100%;
      height: auto;
      margin: 0 auto;
      border-radius: 12px;
    }

    .doc-figure iframe,
    .doc-figure video,
    .doc-figure embed,
    .doc-figure object {
      float: none;
      display: block;
      width: 100%;
      max-width: 100%;
      aspect-ratio: 16 / 9;
      height: auto;
      border: 0;
      border-radius: 12px;
    }
  </style>
</head>
<body>

  <div class="page-shell">
    <section class="page-section">
      <article>

        <!-- Main title -->
        <h1 class="doc-title">Stanovy SPPK</h1>

        <!-- Author • date • source -->
        <p class="doc-meta"><span class="doc-meta-item">SPPK</span><span class="doc-meta-sep">•</span><span class="doc-meta-item">5. júna 2026</span></p>

        <!-- Body: paragraphs, subheadings and standalone figures -->
        <div class="doc-body">
          <p>Prečítajte si aktuálnu verziu Stanov Slovenskej poľnohospodárskej a potravinárskej komory, ktoré boli schválené delegátmi 39. valného zhromaždenia SPPK konaného 28. mája 2026.</p>
        </div>

      </article>
    </section>
  </div>

</body>
</html>
