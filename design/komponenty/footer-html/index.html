<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SPPK – Footer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: #ffffff;
      color: #000000;
      -webkit-font-smoothing: antialiased;
    }

    /* ── Combined Footer ─────────────────────────────────────────────── */
    .site-footer {
      border-top: 1px solid rgba(0,0,0,0.08);
    }

    /* ── Partners section ────────────────────────────────────────────── */
    .partners-section {
      background: #ffffff;
      padding: 64px 24px 56px;
    }
    .partners-inner {
      max-width: 1100px;
      margin: 0 auto;
    }
    .partners-heading {
      text-align: center;
      margin-bottom: 44px;
    }
    .partners-heading h2 {
      font-size: 26px;
      font-weight: 700;
      letter-spacing: 0.14em;
      color: #009a44;
      text-transform: uppercase;
    }

    /* Grid */
    .partners-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      border: 1px solid rgba(0,0,0,0.07);
      border-radius: 16px;
      overflow: hidden;
      background: #ffffff;
      box-shadow: 0 4px 24px rgba(0,0,0,0.05);
    }
    .sponsor-cell {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 20px;
      min-height: 110px;
      text-decoration: none;
      transition: transform 0.25s ease;
    }
    .sponsor-cell:hover { transform: translateY(-2px); }
    .sponsor-cell.border-right  { border-right:  1px solid rgba(0,0,0,0.06); }
    .sponsor-cell.border-bottom { border-bottom: 1px solid rgba(0,0,0,0.06); }
    .sponsor-inner {
      width: 100%;
      height: 72px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 12px;
      background: #ffffff;
      box-shadow: 0 2px 12px rgba(0,0,0,0.07), 0 1px 3px rgba(0,0,0,0.04);
      overflow: hidden;
      padding: 10px 16px;
      transition: box-shadow 0.25s ease;
    }
    .sponsor-cell:hover .sponsor-inner {
      box-shadow: 0 6px 24px rgba(0,154,68,0.14), 0 1px 4px rgba(0,0,0,0.06);
    }
    .sponsor-inner img {
      max-width: 100%;
      max-height: 52px;
      object-fit: contain;
      display: block;
    }
    .sponsor-inner .sponsor-name {
      font-size: 11px;
      font-weight: 600;
      color: #009a44;
      text-align: center;
      line-height: 1.3;
      padding: 0 8px;
    }
    /* 10th sponsor: centred in 3-col grid on desktop */
    .sponsor-last { grid-column: 2; }

    /* ── Legal bar ───────────────────────────────────────────────────── */
    .legal-bar {
      background: #009a44;
      padding: 18px 24px;
      text-align: center;
    }
    .legal-bar-inner {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      flex-wrap: wrap;
    }
    .legal-bar-inner a {
      color: #ffffff;
      font-size: 12.5px;
      font-weight: 400;
      letter-spacing: 0.03em;
      text-decoration: none;
      transition: opacity 0.2s ease;
    }
    .legal-bar-inner a:hover { opacity: 0.7; }
    .legal-sep {
      color: rgba(255,255,255,0.4);
      font-size: 12px;
    }

    /* ── Mobile ──────────────────────────────────────────────────────── */
    @media (max-width: 768px) {
      .partners-grid {
        grid-template-columns: repeat(2, 1fr);
      }
      .sponsor-last {
        grid-column: auto;
      }
    }
  </style>
</head>
<body>

<footer class="site-footer">

  <!-- Partners Section -->
  <div class="partners-section">
    <div class="partners-inner">

      <div class="partners-heading">
        <h2>Naši partneri</h2>
      </div>

      <div class="partners-grid" id="partnersGrid">
        <!-- Cells injected by JS -->
      </div>

    </div>
  </div>

  <!-- Legal Bar -->
  <div class="legal-bar">
    <div class="legal-bar-inner">
      <span style="display:flex;align-items:center;gap:4px;">
        <a href="#">Copyright ©2026 SPPK</a>
        <span class="legal-sep">|</span>
      </span>
      <span style="display:flex;align-items:center;gap:4px;">
        <a href="#">Prevádzka: IZPI Nitra</a>
        <span class="legal-sep">|</span>
      </span>
      <span style="display:flex;align-items:center;gap:4px;">
        <a href="#">Cookies</a>
      </span>
    </div>
  </div>

</footer>

<script>
  const SPONSORS = [
    { name: "Visegrad Fund",                                      img: "../src/imports/visegrad_fund.png",                                    href: "https://www.visegradfund.org" },
    { name: "UniCredit Bank",                                     img: "../src/imports/unicredit_bank.jpg",                                   href: "https://www.unicreditbank.sk" },
    { name: "ČSOB",                                               img: "../src/imports/csob.png",                                             href: "https://www.csob.sk" },
    { name: "Slovenský cukrovarnícky spolok",                     img: "../src/imports/slovensky_cukrovarsky_spolok.png",                     href: "#" },
    { name: "Združenie výrobcov liehu a liehovín na Slovensku",  img: "../src/imports/zdruzenie-vyrobcov-liehu-a-liehovin-na-slovensku.gif", href: "#" },
    { name: "Agrokomplex",                                        img: "../src/imports/agrokomplex.png",                                      href: "https://www.agrokomplex.sk" },
    { name: "Agropoistenie",                                      img: "../src/imports/agropoistenie.png",                                    href: "#" },
    { name: "Združenie pestovateľov obilnín",                     img: "../src/imports/zpo.jpg",                                              href: "#" },
    { name: "Poľnoinfo",                                          img: "../src/imports/polnoinfo.png",                                        href: "https://www.polnoinfo.sk" },
    { name: "CAC Finance",                                        img: "../src/imports/cac_finance.jpg",                                      href: "#" },
  ];

  const grid = document.getElementById("partnersGrid");
  const colCount = 3;

  SPONSORS.forEach((s, i) => {
    const isLast = i === SPONSORS.length - 1;
    const col = i % colCount;
    const isLastRow = i >= SPONSORS.length - (SPONSORS.length % colCount || colCount);

    const a = document.createElement("a");
    a.href = s.href;
    a.target = "_blank";
    a.rel = "noopener noreferrer";
    a.className = "sponsor-cell";
    if (!isLast) {
      if (col < colCount - 1) a.classList.add("border-right");
      a.classList.add("border-bottom");
    }
    if (isLast) a.classList.add("sponsor-last");

    const inner = document.createElement("div");
    inner.className = "sponsor-inner";

    const img = document.createElement("img");
    img.src = s.img;
    img.alt = s.name;
    img.title = s.name;
    img.onerror = function() {
      this.style.display = "none";
      const span = document.createElement("span");
      span.className = "sponsor-name";
      span.textContent = s.name;
      inner.appendChild(span);
    };

    inner.appendChild(img);
    a.appendChild(inner);
    grid.appendChild(a);
  });
</script>

</body>
</html>
